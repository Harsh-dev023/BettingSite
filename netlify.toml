[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[dev]
  port = 8888
  publish = "dist"

# Scheduled function to auto-generate results every minute
[functions."scheduled-auto-result"]
  schedule = "* * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
